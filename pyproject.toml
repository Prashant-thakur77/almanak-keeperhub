[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "almanak-keeperhub"
version = "0.1.0"
description = "KeeperHub as the execution backend for Almanak strategies: dry run, idempotent broadcast, verified receipts."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Prashant Thakur" }]
dependencies = [
    "almanak>=2.28.0",
    "httpx>=0.27",
    "eth-abi>=5",
    "eth-utils>=4",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
almanak-keeperhub = "almanak_keeperhub.cli:main"

# Almanak's gateway discovers wallet registries through this entry-point group
# (almanak/gateway/_server_start_helpers.py::load_wallet_registry).
[project.entry-points."almanak.wallets"]
registry = "almanak_keeperhub.wallets:KeeperHubWalletRegistry"

# The entry-point group proposed upstream (patches/almanak-execution-backend.diff). Almanak
# ignores it until that lands; with it, this package needs no gateway subclass.
[project.entry-points."almanak.execution_backends"]
keeperhub = "almanak_keeperhub.backend:KeeperHubBackend"

[tool.hatch.build.targets.wheel]
packages = ["almanak_keeperhub"]

[tool.hatch.build.targets.sdist]
# The package, its tests and the docs that explain it; not the video build or the recorded proof.
include = ["/almanak_keeperhub", "/tests/unit", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/live"]
markers = ["doc(section): the KeeperHub docs section a live conformance test checks"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "ASYNC109"]  # long log/error strings; `timeout` is Almanak's Submitter signature
